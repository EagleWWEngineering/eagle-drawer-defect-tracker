# Render Blueprint for the Eagle Drawer Defect Tracker.
# https://render.com/docs/blueprint-spec
#
# "New Blueprint" in the Render dashboard reads this file and configures the
# service automatically. Env vars marked `sync: false` are secrets/sensitive
# values Render will prompt for in its dashboard instead of storing here —
# never put real values for those directly in this file or commit them.
#
# This repo has no requirements.txt — it uses pyproject.toml (setuptools),
# so the build command installs from that instead.

services:
  - type: web
    name: eagle-drawer-defect-tracker
    env: python
    plan: starter # persistent disks require a paid plan, not the free tier
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: defect-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Pins the Python runtime. This repo requires >=3.11 (pyproject.toml).
      - key: PYTHON_VERSION
        value: 3.11.10

      # App config (app/config.py) — not secret, safe to default here.
      # Points the SQLite file at the persistent disk mounted above, rather
      # than the app's own relative-path default (which would land inside
      # the ephemeral container filesystem and be lost on every deploy).
      - key: DATABASE_URL
        value: sqlite:////var/data/defect_tracker.db
      # Same persistent disk as DATABASE_URL above, different subdirectory - without
      # this, uploaded defect photos default to a path inside the container's
      # ephemeral filesystem (app/config.py) and are wiped on every redeploy. The
      # app creates this subdirectory automatically on startup if it doesn't exist.
      #
      # 2026-08-17 incident: this line alone did NOT make photos persistent - a
      # plain `value:` here is only read on a service's initial Blueprint
      # creation, not retroactively applied to an already-existing service. This
      # had to also be entered directly in Render's dashboard before it took
      # effect. See app/main.py's startup warning, added the same day, which now
      # makes this failure mode visible in logs instead of silent.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DISPLAY_TIMEZONE
        value: America/New_York
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: SYNC_INTERVAL_MINUTES
        value: "60"

      # Label-scan OCR (docs/PROJECT_SPEC_PHASE9.md Part 3). Ships LIVE by default,
      # unlike other optional features here: OCR_PROVIDER=tesseract runs entirely
      # in the browser (free, no key, no server round trip for recognition), so
      # there is nothing dormant/unconfigured about the default path. Only
      # switching OCR_PROVIDER to a cloud option below makes OCR_API_KEY matter -
      # app/routers/scan.py still 503s that route without a real key.
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_PROVIDER
        value: tesseract

      # Secrets / sensitive values — Rodolfo enters the real value in
      # Render's dashboard after the Blueprint creates the service.
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: PRODUCTION_BRIEF_URL
        sync: false
      - key: DEFAULT_COST_PER_DRAWER
        sync: false
      # Phase 3 relay: checked against the X-Relay-Key header on
      # POST /api/v1/sync/customer-issues/ingest-raw (app/routers/sync.py). Must
      # match the value scripts/relay_customer_issues.py sends from Rodolfo's
      # local machine. Separate secret from APP_USERNAME/APP_PASSWORD_HASH above.
      - key: RELAY_API_KEY
        sync: false
      # Brief Export (Part A): checked against the X-Brief-Key header on
      # GET /api/v1/brief/summary (app/routers/brief.py). The Eagle production
      # brief's VM calls this directly (no relay involved - it has outbound
      # internet access). Separate secret from RELAY_API_KEY - different
      # machine, opposite direction; revoking one must never break the other.
      - key: BRIEF_API_KEY
        sync: false
      # Only meaningful if OCR_PROVIDER above is switched to a cloud option
      # ("azure", "google", or "anthropic") - the default "tesseract" path never
      # reads either of these. Leaving them unset keeps /api/v1/scan/diagnose
      # returning a clean 503 for a cloud provider selected without a key - see
      # app/routers/scan.py. OCR_ENDPOINT is only used by "azure".
      - key: OCR_API_KEY
        sync: false
      - key: OCR_ENDPOINT
        sync: false
