<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Eagle Drawer Defect Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ static_version('css/app.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body data-page="{% block page_name %}{% endblock %}">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="app-header no-print">
    <a class="brand" href="/">Eagle Drawer Defect Tracker</a>
    <nav class="app-nav" aria-label="Main navigation">
      <a href="/">Dashboard</a>
      <a href="/defect-entry">New Defect</a>
      <a href="/daily-summary">Daily Summary</a>
      <a href="/rework-queue">Rework Queue</a>
      <a href="/reports">Reports</a>
      <a href="/customer-issues">Customer Issues</a>
      <a href="/admin">Admin</a>
      <a href="/print-daily-log">Print Log</a>
    </nav>
    <div class="role-selector">
      <label for="actor-role-select">Role (prototype)</label>
      <select id="actor-role-select">
        <option value="QC">QC</option>
        <option value="Manufacturing Engineer">Mfg. Engineer</option>
        <option value="Admin">Admin</option>
      </select>
    </div>
  </header>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-region" role="status" aria-live="polite"></div>

  <div id="bulk-action-bar" class="bulk-action-bar" style="display:none;" role="region" aria-label="Bulk actions">
    <span id="bulk-action-count" class="bulk-action-count"></span>
    <div class="bulk-action-buttons">
      <button type="button" id="bulk-delete-btn" class="danger">🗑 Delete Selected</button>
      <button type="button" id="bulk-clear-btn" class="secondary">Clear Selection</button>
    </div>
  </div>

  <!-- Case detail modal: shared by every page with a case link (Reports, Rework
       Queue, Dashboard) - see app/static/js/app.js openCaseDetail(). -->
  <div id="case-detail-modal" class="modal-overlay no-print" style="display:none;">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="case-detail-title">
      <div class="modal-header">
        <h2 id="case-detail-title">Case</h2>
        <button type="button" id="case-detail-close" class="modal-close" aria-label="Close case detail">&times;</button>
      </div>
      <div id="case-detail-body" class="modal-body"><p>Loading...</p></div>
    </div>
  </div>

  <script src="/static/js/api.js?v={{ static_version('js/api.js') }}"></script>
  <script src="/static/js/charts.js?v={{ static_version('js/charts.js') }}"></script>
  <script src="/static/js/app.js?v={{ static_version('js/app.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
