<!-- Shared date-preset chips (Reports; 2026-10 redesign). Same presets, order and
     labels as production count's KPI page (its app/services/date_range_service.py),
     with "Last 30 days" counted in WORKING days (Rodolfo, 2026-10-06). The From/To
     inputs on the page are the Custom range. Wire it up with app/static/js/app.js
     initDatePresetButtons(). -->
<div class="chip-row" role="group" aria-label="Date range">
  <button type="button" class="chip" data-range="today">Today</button>
  <button type="button" class="chip" data-range="yesterday">Yesterday</button>
  <button type="button" class="chip" data-range="this_week">This week</button>
  <button type="button" class="chip" data-range="last_week">Last week</button>
  <button type="button" class="chip" data-range="month_to_date">Month to date</button>
  <button type="button" class="chip" data-range="last_30_days">Last 30 working days</button>
</div>
